name: ShipNex CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Backend Build and Test
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shipnex_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore backend/ShipNex.sln

      - name: Build backend
        run: dotnet build backend/ShipNex.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test backend/ShipNex.sln --verbosity normal --configuration Release
        env:
          Database__Provider: PostgreSQL
          Database__ConnectionString: Host=localhost;Port=5432;Database=shipnex_test;Username=postgres;Password=postgres
          Jwt__SecretKey: Test_SecretKey_For_CI_2026_ABCDEFGHIJKLMNOPQRSTUVWXYZ
          # `dotnet test` does not set ASPNETCORE_ENVIRONMENT, so the host resolves
          # to Production. Program.cs refuses to start in Production while this flag
          # is true, so pin it explicitly rather than relying on the test content root.
          Email__DevMode: 'false'

  # Frontend Build and Test
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  # Deployment config validation
  # Closes the two §11.3 checks that could not be run on the build machine,
  # where neither docker nor nginx is installed. Both are pure config
  # validation, so they belong in CI rather than being deferred forever.
  config-validation:
    name: Deployment Config Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # §11.3 #3 - the compose edits must actually parse. A malformed
      # docker-compose.prod.yml would otherwise only surface at deploy time,
      # after the image has already been pushed.
      - name: Validate docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config > /dev/null

      # §11.3 #4 - nginx.prod.conf carries the CSP string and
      # client_max_body_size. A typo in the CSP would otherwise ship and
      # silently break Supabase Realtime / Google Maps in production.
      - name: Validate nginx.prod.conf
        run: |
          docker run --rm \
            -v "$PWD/nginx.prod.conf:/etc/nginx/nginx.conf:ro" \
            nginx:alpine nginx -t

      # Also check the dev config, which the compose stack mounts as well.
      - name: Validate nginx.conf
        run: |
          docker run --rm \
            -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:alpine nginx -t

  # Docker Build and Push
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend, config-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Production
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GitHub cannot reach a self-hosted VPS, so the deploy is driven from here
      # over SSH and reuses deploy.sh on the server. `docker compose up -d` is a
      # rolling-style restart: the image tag is already published by the docker job.
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          set -euo pipefail
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not configured for the production environment."
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key so a MITM cannot silently capture the deploy key.
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git fetch --all --tags && git checkout '${{ github.sha }}' && SHIPNEX_IMAGE='$IMAGE' ./deploy.sh"
          rm -f ~/.ssh/deploy_key

      # A successful `docker compose up` only proves the containers started. Gate
      # the release on the public readiness endpoint, which includes the database
      # probe, so a half-working deploy is caught here instead of by a customer.
      - name: Verify deployment (readiness)
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || secrets.HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HEALTH_URL:-}" ]; then
            echo "::notice::No HEALTH_URL configured; skipping the post-deploy probe."
            exit 0
          fi
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH_URL/health/ready" || echo 000)
            if [ "$status" = "200" ]; then
              echo "Readiness OK after ${i} attempt(s)."
              exit 0
            fi
            echo "Attempt $i: /health/ready returned $status - retrying in 5s"
            sleep 5
          done
          echo "::error::Deployment did not become ready at $HEALTH_URL/health/ready"
          exit 1
