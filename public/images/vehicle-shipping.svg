<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="vs-title vs-desc" preserveAspectRatio="xMidYMid slice">
  <title id="vs-title">Ro-Ro car carrier at sea</title>
  <desc id="vs-desc">A roll-on roll-off vehicle carrier vessel loaded with cars, sailing at dusk.</desc>
  <defs>
    <linearGradient id="vsSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2470"/>
      <stop offset="0.5" stop-color="#2e6cb6"/>
      <stop offset="0.85" stop-color="#8fb6dd"/>
      <stop offset="1" stop-color="#f2b071"/>
    </linearGradient>
    <linearGradient id="vsSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5c93"/>
      <stop offset="0.35" stop-color="#123f7c"/>
      <stop offset="1" stop-color="#061a45"/>
    </linearGradient>
    <linearGradient id="vsHull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2450a8"/>
      <stop offset="1" stop-color="#0a1f5c"/>
    </linearGradient>
    <linearGradient id="vsDeck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8eef7"/>
      <stop offset="1" stop-color="#b9c8de"/>
    </linearGradient>
    <radialGradient id="vsSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0c9" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffc978" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9d4d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="250" fill="url(#vsSky)"/>
  <circle cx="470" cy="196" r="110" fill="url(#vsSun)"/>
  <circle cx="470" cy="200" r="26" fill="#fff2d2" opacity="0.9"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.28">
    <ellipse cx="120" cy="66" rx="72" ry="16"/>
    <ellipse cx="168" cy="58" rx="52" ry="20"/>
    <ellipse cx="300" cy="44" rx="60" ry="13"/>
    <ellipse cx="410" cy="104" rx="46" ry="11"/>
  </g>
  <g fill="#ffffff" opacity="0.18">
    <ellipse cx="230" cy="118" rx="86" ry="9"/>
    <ellipse cx="520" cy="72" rx="58" ry="10"/>
  </g>

  <!-- Sea -->
  <rect y="250" width="600" height="150" fill="url(#vsSea)"/>
  <g fill="#ffffff" opacity="0.16">
    <rect x="20" y="268" width="120" height="2" rx="1"/>
    <rect x="180" y="264" width="70" height="2" rx="1"/>
    <rect x="320" y="272" width="150" height="2" rx="1"/>
    <rect x="60" y="356" width="180" height="3" rx="1.5"/>
    <rect x="300" y="368" width="220" height="3" rx="1.5"/>
    <rect x="140" y="382" width="120" height="3" rx="1.5"/>
  </g>
  <g fill="#ffd79a" opacity="0.5">
    <rect x="440" y="268" width="60" height="2" rx="1"/>
    <rect x="455" y="280" width="36" height="2" rx="1"/>
    <rect x="470" y="294" width="70" height="2" rx="1"/>
    <rect x="430" y="308" width="44" height="2" rx="1"/>
  </g>

  <!-- Hull -->
  <path d="M46 300 H556 L540 344 Q532 356 506 356 H112 Q84 356 72 342 Z" fill="url(#vsHull)"/>
  <path d="M46 300 H556 L552 312 H52 Z" fill="#ff8f00"/>
  <path d="M60 322 H548 L542 332 H66 Z" fill="#ffffff" opacity="0.14"/>
  <path d="M112 356 H506 Q532 356 540 344 L536 336 H118 Z" fill="#05123a" opacity="0.55"/>

  <!-- Lower car deck -->
  <rect x="86" y="286" width="440" height="15" fill="url(#vsDeck)"/>
  <g>
    <rect x="94"  y="272" width="42" height="15" rx="4" fill="#e2e8f0"/><rect x="101" y="275" width="14" height="6" rx="2" fill="#93a4bd"/>
    <rect x="146" y="274" width="52" height="13" rx="4" fill="#ff6f00"/><rect x="156" y="277" width="18" height="6" rx="2" fill="#7a3a00" opacity="0.6"/>
    <rect x="208" y="272" width="42" height="15" rx="4" fill="#1e3a8a"/><rect x="215" y="275" width="14" height="6" rx="2" fill="#8fa8d8"/>
    <rect x="260" y="273" width="48" height="14" rx="4" fill="#e2e8f0"/><rect x="269" y="276" width="16" height="6" rx="2" fill="#93a4bd"/>
    <rect x="318" y="271" width="42" height="16" rx="4" fill="#2e7d32"/><rect x="325" y="274" width="14" height="6" rx="2" fill="#bfe0c2"/>
    <rect x="370" y="274" width="52" height="13" rx="4" fill="#e2e8f0"/><rect x="380" y="277" width="18" height="6" rx="2" fill="#93a4bd"/>
    <rect x="432" y="272" width="42" height="15" rx="4" fill="#ff6f00"/><rect x="439" y="275" width="14" height="6" rx="2" fill="#7a3a00" opacity="0.6"/>
  </g>

  <!-- Upper car deck -->
  <rect x="112" y="248" width="390" height="14" fill="url(#vsDeck)"/>
  <g>
    <rect x="120" y="235" width="44" height="14" rx="4" fill="#e2e8f0"/><rect x="128" y="238" width="14" height="6" rx="2" fill="#93a4bd"/>
    <rect x="174" y="236" width="50" height="13" rx="4" fill="#1e3a8a"/><rect x="184" y="239" width="18" height="6" rx="2" fill="#8fa8d8"/>
    <rect x="234" y="234" width="42" height="15" rx="4" fill="#ff8f00"/><rect x="241" y="237" width="14" height="6" rx="2" fill="#7a3a00" opacity="0.6"/>
    <rect x="286" y="235" width="46" height="14" rx="4" fill="#e2e8f0"/><rect x="295" y="238" width="16" height="6" rx="2" fill="#93a4bd"/>
    <rect x="342" y="234" width="42" height="15" rx="4" fill="#2e7d32"/><rect x="349" y="237" width="14" height="6" rx="2" fill="#bfe0c2"/>
    <rect x="394" y="236" width="50" height="13" rx="4" fill="#e2e8f0"/><rect x="404" y="239" width="18" height="6" rx="2" fill="#93a4bd"/>
    <rect x="454" y="235" width="42" height="14" rx="4" fill="#1e3a8a"/><rect x="461" y="238" width="14" height="6" rx="2" fill="#8fa8d8"/>
  </g>

  <!-- Stern superstructure / bridge -->
  <rect x="502" y="196" width="76" height="104" fill="#f4f7fb"/>
  <rect x="502" y="196" width="76" height="10" fill="#d7e0ec"/>
  <rect x="512" y="214" width="26" height="9" rx="2" fill="#2b4a7d"/>
  <rect x="546" y="214" width="22" height="9" rx="2" fill="#2b4a7d"/>
  <rect x="512" y="232" width="26" height="9" rx="2" fill="#2b4a7d"/>
  <rect x="546" y="232" width="22" height="9" rx="2" fill="#2b4a7d"/>
  <rect x="512" y="250" width="56" height="9" rx="2" fill="#2b4a7d"/>
  <rect x="512" y="268" width="12" height="10" rx="2" fill="#3b5f96"/>
  <rect x="530" y="268" width="12" height="10" rx="2" fill="#3b5f96"/>
  <rect x="548" y="268" width="12" height="10" rx="2" fill="#3b5f96"/>
  <rect x="566" y="268" width="6" height="10" rx="2" fill="#3b5f96"/>

  <!-- Mast + funnel -->
  <rect x="470" y="160" width="4" height="40" fill="#c3cede"/>
  <rect x="462" y="156" width="20" height="5" rx="2" fill="#c3cede"/>
  <circle cx="472" cy="152" r="4" fill="#ff8f00"/>
  <rect x="430" y="228" width="20" height="28" rx="4" fill="#ff6f00"/>
  <rect x="434" y="234" width="12" height="5" rx="2" fill="#ffffff" opacity="0.85"/>

  <!-- Waterline foam -->
  <g fill="#ffffff" opacity="0.35">
    <path d="M34 348 Q70 358 118 352 Q92 366 56 362 Z"/>
    <path d="M120 352 Q168 360 214 354 Q186 368 148 364 Z" opacity="0.7"/>
  </g>
  <g fill="#ffffff" opacity="0.14">
    <path d="M232 352 Q300 360 380 354 Q340 370 268 366 Z"/>
  </g>
</svg>
