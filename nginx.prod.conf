# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name _;
    server_tokens off;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    # NOTE: stapling verification needs `ssl_trusted_certificate /etc/nginx/ssl/chain.pem;`
    # uncommented once deploy.sh has copied the issuer chain into ./ssl. Leaving it out
    # only disables the verification step - it does not break startup (unlike a
    # `ssl_trusted_certificate` pointing at a file that does not exist).
    ssl_stapling_verify on;

    # Upload limit. The API accepts 10 MB (DocumentUploadValidator.MaxFileSizeBytes =
    # 10485760) plus 64 KB of multipart overhead, but nginx defaults to 1 MB - every
    # document larger than that returned 413 at the proxy. Keep headroom above the API
    # limit; change both together.
    client_max_body_size 12m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Content-Security-Policy. Tuned to the actual dependencies (see src/services/realtime.ts
    # for the Supabase WebSocket client and src/components/Map.tsx for Google Maps):
    #   - wss://*.supabase.co is required for Supabase Realtime live tracking.
    #   - 'unsafe-inline' on style-src only: React/Vite injects inline styles at runtime.
    #   - blob: in worker-src/img-src is needed for client-side map/canvas work.
    # Tighten to 'self' script-src only if the Maps script loader is replaced with
    # an API-backed static map, and drop it if Supabase Realtime is disabled.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://maps.googleapis.com https://maps.gstatic.com https://*.googleusercontent.com; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://maps.googleapis.com; worker-src 'self' blob:" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # Never serve dotfiles (.git, .env, editor droppings) from the SPA root.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API builds absolute tracking links from App:BaseUrl, so it must also know
        # which host/port the client actually reached us on.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Health check endpoint (startup probe target; exact match)
    location = /health {
        proxy_pass http://backend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Readiness probe — database reachability. Needs its own exact-match
    # location: nested paths never fall through to the /health block above,
    # and without this they would hit the SPA fallback and return index.html.
    location = /health/ready {
        proxy_pass http://backend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
